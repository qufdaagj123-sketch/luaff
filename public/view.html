<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Script — LuaProtect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07070c;--bg2:#101018;--border:#2a2a38;--text:#f0f0f5;--muted:#9494a8;--accent:#8b5cf6;--red:#f87171;--green:#34d399}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px}
    .box{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px}
    h1{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;margin-bottom:6px}
    .meta{color:var(--muted);font-size:.88rem;margin-bottom:20px}
    label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
    input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
      color:var(--text);font-size:.95rem;outline:none;margin-bottom:12px}
    input:focus{border-color:var(--accent)}
    .btn{width:100%;padding:12px;border:none;border-radius:11px;font-weight:600;font-size:.9rem;cursor:pointer;
      background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-family:inherit}
    .err{color:var(--red);font-size:.85rem;margin-top:10px;display:none}
    #unlocked{display:none}
    pre{background:#0a0a10;border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;
      max-height:50vh;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .btn-g{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;
      cursor:pointer;font-size:.82rem;font-family:inherit}
  </style>
</head>
<body>
  <div class="box">
    <div id="lock">
      <h1 id="title">Protected Script</h1>
      <p class="meta" id="meta">Nhập mật khẩu để xem nội dung script</p>
      <label>Mật khẩu</label>
      <input type="password" id="pw" placeholder="••••••••" />
      <button class="btn" id="btn">Mở khóa</button>
      <p class="err" id="err"></p>
    </div>
    <div id="unlocked">
      <h1 id="title2">Script</h1>
      <p class="meta" style="color:var(--green)">✓ Đã mở khóa</p>
      <pre id="code"></pre>
      <div class="actions">
        <button class="btn-g" onclick="copyCode()">Copy script</button>
        <button class="btn-g" onclick="downloadCode()">Tải .lua</button>
      </div>
    </div>
  </div>
  <script>
    const id = location.pathname.split('/').pop();
    let scriptText = '';

    async function loadMeta(){
      try{
        const r=await fetch('/api/meta/'+id);
        if(!r.ok) throw new Error('Không tìm thấy script');
        const d=await r.json();
        document.getElementById('title').textContent=d.title||'Protected Script';
        document.getElementById('title2').textContent=d.title||'Script';
        let m='ID: '+d.id;
        if(d.note) m+=' · '+d.note;
        document.getElementById('meta').textContent=m;
      }catch(e){
        document.getElementById('title').textContent='Không tìm thấy';
        document.getElementById('meta').textContent=e.message;
        document.getElementById('btn').disabled=true;
      }
    }

    document.getElementById('btn').onclick=async()=>{
      const err=document.getElementById('err');
      err.style.display='none';
      try{
        const r=await fetch('/api/unlock/'+id,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password:document.getElementById('pw').value})
        });
        const d=await r.json();
        if(!r.ok) throw new Error(d.error||'Sai mật khẩu');
        scriptText=d.script;
        document.getElementById('code').textContent=d.script;
        document.getElementById('lock').style.display='none';
        document.getElementById('unlocked').style.display='block';
      }catch(e){
        err.textContent=e.message;err.style.display='block';
      }
    };
    document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn').click()});

    function copyCode(){navigator.clipboard.writeText(scriptText)}
    function downloadCode(){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([scriptText],{type:'text/plain'}));
      a.download='script.lua';a.click();
    }
    loadMeta();
  </script>
</body>
</html>
